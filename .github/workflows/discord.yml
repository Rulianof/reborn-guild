# Rappel Discord des enchants/gemmes manquants, les jours de raid (voir config.json → discord).
# GitHub retarde souvent les tâches planifiées : on tente plusieurs fois l'après-midi des jours de raid,
# et le rappel part au premier passage dans la fenêtre (une seule fois par jour, mémorisé dans le cache).
name: Rappel Discord

on:
  schedule:
    - cron: '*/20 15-19 * * 3,4'
  workflow_dispatch:   # bouton « Run workflow » : envoie le rappel tout de suite

permissions:
  contents: read
  actions: write

jobs:
  rappel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Est-ce le moment du rappel ?
        id: check
        run: node scripts/discord.mjs --check
      - name: Déjà envoyé aujourd'hui ?
        id: sent
        if: github.event_name == 'schedule' && steps.check.outputs.send == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .discord-sent
          key: discord-${{ steps.check.outputs.date }}
          lookup-only: true
      - name: Synchro Blizzard
        id: go
        if: github.event_name == 'workflow_dispatch' || (steps.check.outputs.send == 'true' && steps.sent.outputs.cache-hit != 'true')
        run: node scripts/sync.mjs
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      - name: Envoi sur Discord
        if: steps.go.outcome == 'success'
        run: node scripts/discord.mjs --force && echo envoyé > .discord-sent
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Mémorise l'envoi du jour
        if: steps.go.outcome == 'success' && github.event_name == 'schedule'
        uses: actions/cache/save@v4
        with:
          path: .discord-sent
          key: discord-${{ steps.check.outputs.date }}
