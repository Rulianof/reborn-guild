# Rappel Discord des enchants/gemmes manquants, les jours de raid (voir config.json → discord).
# Tourne chaque heure mais n'agit qu'à l'heure configurée (heure de Paris, été comme hiver).
name: Rappel Discord

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:   # bouton « Run workflow » : envoie le rappel tout de suite

permissions:
  contents: read

jobs:
  rappel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Est-ce l'heure du rappel ?
        id: check
        run: node scripts/discord.mjs --check
      - name: Synchro Blizzard
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.send == 'true'
        run: node scripts/sync.mjs
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      - name: Envoi sur Discord
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.send == 'true'
        run: node scripts/discord.mjs --force
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
